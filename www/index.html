<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#08080c" />
<title>LOOPER // RAGE PAD</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');

  :root {
    --bg: #08080c; --bg2: #0e0e16; --panel: #14141f;
    --purple: #b026ff; --cyan: #00f0ff; --red: #ff2d55;
    --green: #39ff14; --orange: #ff9f1c; --txt: #e8e8f0; --dim: #6a6a82;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { height:100%; background:var(--bg); color:var(--txt); font-family:'Share Tech Mono',monospace; overflow:hidden; overscroll-behavior:none; touch-action:manipulation; }
  body {
    display:flex; flex-direction:column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background:
      radial-gradient(circle at 20% 0%, rgba(176,38,255,0.12), transparent 45%),
      radial-gradient(circle at 90% 100%, rgba(0,240,255,0.10), transparent 45%),
      var(--bg);
  }

  header { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:8px 16px 4px; }
  .logo { font-family:'Orbitron',sans-serif; font-weight:900; font-size:21px; letter-spacing:2px; color:#fff;
    text-shadow:0 0 8px var(--purple),0 0 18px rgba(176,38,255,0.6); position:relative; }
  .logo span { color:var(--cyan); text-shadow:0 0 8px var(--cyan); }
  .logo.glitch::after { content:'LOOPER'; position:absolute; left:2px; top:0; color:var(--red); opacity:.7;
    clip-path:inset(0 0 60% 0); animation:glitch 1.6s infinite steps(2); pointer-events:none; }
  @keyframes glitch { 0%,90%,100%{transform:translate(0,0)} 92%{transform:translate(-2px,1px)} 94%{transform:translate(2px,-1px)} 96%{transform:translate(-1px,0)} }
  .status { font-size:11px; color:var(--dim); text-align:right; line-height:1.4; }
  .status b { color:var(--green); }
  .status .rec { color:var(--red); }

  .grid { flex:1 1 auto; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr);
    gap:7px; padding:6px 12px; min-height:0; }
  .pad { position:relative; border-radius:14px; background:linear-gradient(160deg,var(--panel),var(--bg2));
    border:1px solid rgba(255,255,255,0.06); display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; overflow:hidden; cursor:pointer; transition:transform .04s ease, box-shadow .12s ease; --c:var(--purple); }
  .pad::before { content:''; position:absolute; inset:0; border-radius:14px;
    background:radial-gradient(circle at 50% 120%,var(--c),transparent 70%); opacity:.16; pointer-events:none; transition:opacity .15s; }
  .pad .num { position:absolute; top:5px; left:8px; font-size:10px; color:var(--dim); }
  .pad .lbl { font-size:12px; font-weight:700; letter-spacing:.5px; color:#fff; text-shadow:0 0 6px var(--c); padding:0 4px; z-index:2; line-height:1.1; }
  .pad .sub { font-size:9px; color:var(--dim); margin-top:2px; z-index:2; }
  .pad.active { transform:scale(0.94); box-shadow:0 0 18px var(--c),0 0 40px var(--c), inset 0 0 22px rgba(255,255,255,0.08); }
  .pad.active::before { opacity:.55; }
  /* latched = looping */
  .pad.latched { border-color:var(--c); box-shadow:0 0 14px var(--c), inset 0 0 18px rgba(255,255,255,0.04); }
  .pad.latched::before { opacity:.4; }
  .pad .loopbadge { position:absolute; top:5px; right:7px; font-size:8px; letter-spacing:.5px; color:var(--c);
    opacity:0; text-shadow:0 0 6px var(--c); }
  .pad.latched .loopbadge { opacity:1; }
  /* selected for editing */
  .pad.selected { outline:2px dashed var(--c); outline-offset:-4px; }

  .controls { flex:0 0 auto; background:linear-gradient(180deg,rgba(20,20,31,0.6),rgba(10,10,18,0.96));
    border-top:1px solid rgba(176,38,255,0.25); padding:8px 12px calc(8px + env(safe-area-inset-bottom)); }
  .row { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .row:last-child { margin-bottom:0; }

  /* step bar */
  .steps { display:flex; gap:3px; align-items:center; flex:1 1 auto; }
  .steplight { flex:1 1 0; height:14px; border-radius:3px; background:#1c1c2a; border:1px solid #262638;
    transition:background .05s, box-shadow .05s; position:relative; }
  .steplight.on { background:var(--sc,var(--purple)); box-shadow:0 0 8px var(--sc,var(--purple)); }
  .steplight.head::after { content:''; position:absolute; inset:0; border-radius:3px; border:1px solid #fff; opacity:.85; }
  .steplbl { font-size:9px; color:var(--dim); width:54px; text-align:right; letter-spacing:.5px; }

  /* knobs */
  .knobwrap { display:flex; flex-direction:column; align-items:center; gap:2px; }
  .knob { width:48px; height:48px; border-radius:50%; background:radial-gradient(circle at 50% 40%,#20202e,#0a0a12);
    border:2px solid var(--c,var(--purple)); position:relative; box-shadow:0 0 10px rgba(176,38,255,0.4), inset 0 2px 6px rgba(0,0,0,0.6);
    touch-action:none; --c:var(--purple); }
  .knob.cyan { --c:var(--cyan); } .knob.red { --c:var(--red); } .knob.orange { --c:var(--orange); }
  .knob::after { content:''; position:absolute; left:50%; top:5px; width:3px; height:15px; border-radius:2px; background:var(--c);
    transform-origin:50% 19px; transform:translateX(-50%) rotate(var(--rot,-135deg)); box-shadow:0 0 6px var(--c); }
  .knob .val { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
    color:#fff; pointer-events:none; text-shadow:0 0 6px var(--c); }
  .klabel { font-size:8px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; }

  .bpmdial { width:62px; height:62px; border-radius:50%; background:radial-gradient(circle at 50% 40%,#1a1a28,#060609);
    border:2px solid var(--cyan); position:relative; box-shadow:0 0 14px rgba(0,240,255,0.5), inset 0 2px 8px rgba(0,0,0,0.7); touch-action:none; }
  .bpmdial::after { content:''; position:absolute; left:50%; top:4px; width:3px; height:20px; border-radius:2px; background:var(--cyan);
    box-shadow:0 0 8px var(--cyan); transform-origin:50% 27px; transform:translateX(-50%) rotate(var(--rot,-135deg)); }
  .bpmval { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
  .bpmval b { font-family:'Orbitron'; font-size:16px; color:#fff; text-shadow:0 0 8px var(--cyan); }
  .bpmval small { font-size:7px; color:var(--dim); letter-spacing:1px; }

  .spacer { flex:1 1 auto; }
  .col { display:flex; flex-direction:column; gap:5px; }
  .btn { font-family:'Orbitron',sans-serif; font-weight:700; font-size:11px; letter-spacing:1px; padding:9px 10px; border-radius:9px;
    background:var(--panel); color:var(--txt); border:1px solid rgba(255,255,255,0.12); cursor:pointer; transition:all .12s ease; text-transform:uppercase; }
  .btn:active { transform:scale(0.95); }
  .btn.sm { font-size:10px; padding:7px 8px; }
  .btn.play { color:var(--green); border-color:var(--green); }
  .btn.play.on { background:var(--green); color:#000; box-shadow:0 0 16px var(--green); }
  .btn.lofi.on { background:var(--orange); color:#000; border-color:var(--orange); box-shadow:0 0 12px var(--orange); }

  /* mode selector */
  .modes { display:flex; border:1px solid rgba(255,255,255,0.12); border-radius:9px; overflow:hidden; }
  .modes button { font-family:'Orbitron',sans-serif; font-weight:700; font-size:10px; letter-spacing:1px; padding:9px 9px;
    background:transparent; color:var(--dim); border:none; cursor:pointer; }
  .modes button.on { color:#000; background:var(--cyan); box-shadow:0 0 12px var(--cyan); }

  #flash { position:fixed; inset:0; pointer-events:none; z-index:99; background:var(--cyan); opacity:0; mix-blend-mode:screen; }
  #toast { position:fixed; left:50%; bottom:30%; transform:translateX(-50%); background:rgba(10,10,18,0.95);
    border:1px solid var(--cyan); color:#fff; padding:10px 18px; border-radius:10px; font-size:13px; z-index:200;
    box-shadow:0 0 20px rgba(0,240,255,0.4); opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
</style>
</head>
<body>
  <div id="flash"></div>
  <div id="toast"></div>

  <header>
    <div class="logo glitch">LOO<span>PER</span></div>
    <div class="status">
      <div>MODE <b id="modeTxt">LOOP</b></div>
      <div id="engineTxt">tap to start</div>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <section class="controls">
    <div class="row">
      <div class="steplbl" id="stepLbl">LOOP</div>
      <div class="steps" id="steps"></div>
    </div>
    <div class="row">
      <div class="knobwrap"><div class="bpmdial" id="bpmDial"><div class="bpmval"><b id="bpmNum">140</b><small>BPM</small></div></div></div>
      <div class="knobwrap"><div class="knob" id="kReverb"><div class="val" id="vReverb">20</div></div><div class="klabel">Verb</div></div>
      <div class="knobwrap"><div class="knob red" id="kDrive"><div class="val" id="vDrive">15</div></div><div class="klabel">Drive</div></div>
      <div class="knobwrap"><div class="knob cyan" id="kFilter"><div class="val" id="vFilter">100</div></div><div class="klabel">Filter</div></div>
      <div class="spacer"></div>
      <div class="col">
        <button class="btn play" id="btnPlay">▶ PLAY</button>
        <button class="btn lofi sm" id="btnLofi">LO-FI</button>
      </div>
    </div>
    <div class="row">
      <div class="modes" id="modes">
        <button data-mode="loop" class="on">LOOP</button>
        <button data-mode="tap">TAP</button>
        <button data-mode="edit">EDIT</button>
      </div>
      <div class="spacer"></div>
      <button class="btn sm" id="btnSave">SAVE</button>
      <button class="btn sm" id="btnLoad">LOAD</button>
      <button class="btn sm" id="btnWav">WAV</button>
      <button class="btn sm" id="btnClr">CLR</button>
    </div>
  </section>

<script>
"use strict";

/* ============================================================
   LOOPER // RAGE PAD  —  Web Audio DJ-looper engine
   Tap a pad in LOOP mode and its groove latches into a
   continuously looping 16-step transport synced to BPM.
   Layer pads to build a beat. All sounds synthesized live.
   ============================================================ */

let AC = null;
let busIn, master, comp;
let driveNode, driveDry, driveWet, postDrive;
let masterFilter, lofiNode, convolver, dryGain, wetGain;
let reverbAmount = 0.20, driveAmount = 0.15, filterAmount = 1.0, lofiOn = false;

/* ---------- audio graph ---------- */
function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  ({ busIn, master, comp, driveNode, driveDry, driveWet, postDrive,
     masterFilter, lofiNode, convolver, dryGain, wetGain } = buildChain(AC));
  setDrive(driveAmount); setReverb(reverbAmount); setFilter(filterAmount); setLofi(lofiOn);
  document.getElementById('engineTxt').innerHTML = '<b>ENGINE ON</b>';
}

/* Build the full FX chain in a given context (reused for offline WAV render). */
function buildChain(ctx) {
  const busIn = ctx.createGain();
  const driveNode = ctx.createWaveShaper(); driveNode.oversample = '4x';
  const driveDry = ctx.createGain(), driveWet = ctx.createGain();
  const postDrive = ctx.createGain();
  const masterFilter = ctx.createBiquadFilter(); masterFilter.type = 'lowpass'; masterFilter.frequency.value = 18000;
  const lofiNode = ctx.createWaveShaper(); lofiNode.oversample = 'none';
  const convolver = ctx.createConvolver(); convolver.buffer = makeImpulse(ctx, 2.4, 2.6);
  const dryGain = ctx.createGain(), wetGain = ctx.createGain();
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -10; comp.knee.value = 20; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.18;
  const master = ctx.createGain(); master.gain.value = 0.9;

  // busIn -> drive(dry+wet) -> postDrive -> filter -> lofi -> reverb(dry+wet) -> comp -> master -> dest
  busIn.connect(driveDry); busIn.connect(driveNode); driveNode.connect(driveWet);
  driveDry.connect(postDrive); driveWet.connect(postDrive);
  postDrive.connect(masterFilter); masterFilter.connect(lofiNode);
  lofiNode.connect(dryGain); lofiNode.connect(convolver); convolver.connect(wetGain);
  dryGain.connect(comp); wetGain.connect(comp); comp.connect(master); master.connect(ctx.destination);

  return { busIn, master, comp, driveNode, driveDry, driveWet, postDrive, masterFilter, lofiNode, convolver, dryGain, wetGain };
}

function makeDriveCurve(amount) {
  const k = amount * 100, n = 1024, curve = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = (i * 2) / n - 1; curve[i] = (Math.PI + k) * x / (Math.PI + k * Math.abs(x)); }
  return curve;
}
function makeCrushCurve(bits) {
  const n = 1024, curve = new Float32Array(n), step = Math.pow(0.5, bits);
  for (let i = 0; i < n; i++) { const x = (i * 2) / n - 1; curve[i] = step * Math.floor(x / step + 0.5); }
  return curve;
}
function makeLinearCurve() { const n = 2, c = new Float32Array(n); c[0] = -1; c[1] = 1; return c; }

function makeImpulse(ctx, duration, decay) {
  const rate = ctx.sampleRate, len = rate * duration, imp = ctx.createBuffer(2, len, rate);
  for (let ch = 0; ch < 2; ch++) { const d = imp.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay); }
  return imp;
}
function setDrive(v) { driveAmount = v; if (!AC) return; driveNode.curve = makeDriveCurve(v); driveWet.gain.value = v * 0.9; driveDry.gain.value = 1 - v * 0.5; }
function setReverb(v) { reverbAmount = v; if (!AC) return; wetGain.gain.value = v; dryGain.gain.value = 1 - v * 0.4; }
function setFilter(v) { // v: 0..1 -> log freq 300..18000
  filterAmount = v; if (!AC) return;
  const f = 300 * Math.pow(60, lofiOn ? Math.min(v, 0.45) : v);
  masterFilter.frequency.setTargetAtTime(f, AC.currentTime, 0.02);
}
function setLofi(on) { lofiOn = on; if (!AC) return;
  lofiNode.curve = on ? makeCrushCurve(6) : makeLinearCurve();
  setFilter(filterAmount);
}

/* ---------- helpers ---------- */
function noiseBuffer(ctx, dur) {
  const len = ctx.sampleRate * dur, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; return buf;
}
function env(gain, t, a, peak, d, r) {
  const g = gain.gain; g.cancelScheduledValues(t); g.setValueAtTime(0.0001, t);
  g.exponentialRampToValueAtTime(peak, t + a); g.exponentialRampToValueAtTime(0.0001, t + a + d + r);
}

/* ============================================================
   SOUND PALETTE — each takes (ctx, dest, t) so it can render
   live or into an OfflineAudioContext for WAV export.
   ============================================================ */
const SOUNDS = {
  kick808(ctx, dest, t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.18);
    const lfo = ctx.createOscillator(), lfoG = ctx.createGain(); lfo.frequency.value = 7; lfoG.gain.value = 12;
    lfo.connect(lfoG); lfoG.connect(o.frequency); lfo.start(t); lfo.stop(t + 0.5);
    g.gain.setValueAtTime(1.0, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.65);
  },
  subThud(ctx, dest, t) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine';
    o.frequency.setValueAtTime(60, t); o.frequency.exponentialRampToValueAtTime(32, t + 0.4);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.95);
  },
  snareClap(ctx, dest, t) {
    const o = ctx.createOscillator(), og = ctx.createGain(); o.type = 'triangle';
    o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(120, t + 0.1);
    og.gain.setValueAtTime(0.5, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    const sh = ctx.createWaveShaper(); sh.curve = makeDriveCurve(0.6);
    o.connect(og); og.connect(sh); sh.connect(dest); o.start(t); o.stop(t + 0.2);
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(ctx, 0.25);
    const nf = ctx.createBiquadFilter(); nf.type = 'highpass'; nf.frequency.value = 1400;
    const ng = ctx.createGain(); ng.gain.setValueAtTime(0.8, t); ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
    n.connect(nf); nf.connect(ng); ng.connect(dest); n.start(t); n.stop(t + 0.25);
    for (let i = 0; i < 3; i++) { const ct = t + 0.012 * i;
      const cn = ctx.createBufferSource(); cn.buffer = noiseBuffer(ctx, 0.1);
      const cf = ctx.createBiquadFilter(); cf.type = 'bandpass'; cf.frequency.value = 1800; cf.Q.value = 1.2;
      const cg = ctx.createGain(); cg.gain.setValueAtTime(0.5, ct); cg.gain.exponentialRampToValueAtTime(0.0001, ct + 0.08);
      cn.connect(cf); cf.connect(cg); cg.connect(dest); cn.start(ct); cn.stop(ct + 0.1); }
  },
  hatClosed(ctx, dest, t) {
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(ctx, 0.06);
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.045);
    n.connect(f); f.connect(g); g.connect(dest); n.start(t); n.stop(t + 0.06);
  },
  hatOpen(ctx, dest, t) {
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(ctx, 0.4);
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6500;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.45, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.38);
    n.connect(f); f.connect(g); g.connect(dest); n.start(t); n.stop(t + 0.4);
  },
  hatRoll(ctx, dest, t) {
    const reps = 6;
    for (let i = 0; i < reps; i++) { const rt = t + i * 0.045;
      const n = ctx.createBufferSource(); n.buffer = noiseBuffer(ctx, 0.04);
      const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 8000;
      const g = ctx.createGain(); const lvl = 0.4 * (1 - i / (reps + 2));
      g.gain.setValueAtTime(lvl, rt); g.gain.exponentialRampToValueAtTime(0.0001, rt + 0.035);
      n.connect(f); f.connect(g); g.connect(dest); n.start(rt); n.stop(rt + 0.04); }
  },
  crashGlitch(ctx, dest, t) {
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(ctx, 1.2);
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 4000;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    const lfo = ctx.createOscillator(), lg = ctx.createGain(); lfo.type = 'square'; lfo.frequency.value = 55; lg.gain.value = 0.25;
    lfo.connect(lg); lg.connect(g.gain); lfo.start(t); lfo.stop(t + 1.1);
    n.connect(f); f.connect(g); g.connect(dest); n.start(t); n.stop(t + 1.2);
  },
  rimshot(ctx, dest, t) {
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square';
    o.frequency.setValueAtTime(440, t); o.frequency.exponentialRampToValueAtTime(180, t + 0.04);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.08);
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1700; f.Q.value = 3;
    o.connect(f); f.connect(g); g.connect(dest); o.start(t); o.stop(t + 0.1);
  },
  darkPad(ctx, dest, t) {
    const freqs = [110, 164.81, 220, 277.18];
    const out = ctx.createGain(); out.gain.value = 0.0001; env(out, t, 0.25, 0.4, 0.4, 1.6);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass';
    lp.frequency.setValueAtTime(300, t); lp.frequency.linearRampToValueAtTime(1400, t + 0.8); lp.frequency.linearRampToValueAtTime(400, t + 2.2);
    freqs.forEach((fr, i) => { const o = ctx.createOscillator(); o.type = i % 2 ? 'sawtooth' : 'triangle';
      o.frequency.value = fr; o.detune.value = (i - 1.5) * 8; o.connect(lp); o.start(t); o.stop(t + 2.6); });
    lp.connect(out); out.connect(dest);
  },
  bellStab(ctx, dest, t) {
    const partials = [1, 2.01, 3.03, 4.16], base = 523.25;
    const out = ctx.createGain(); out.gain.value = 0.0001; env(out, t, 0.005, 0.5, 0.3, 1.0);
    partials.forEach((p, i) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'sine';
      o.frequency.value = base * p; o.detune.value = (i - 1.5) * 12; g.gain.value = 0.5 / (i + 1);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 1.3); });
    out.connect(dest);
  },
  vinylScratch(ctx, dest, t) {
    const n = ctx.createBufferSource(); n.buffer = noiseBuffer(ctx, 0.5);
    n.playbackRate.setValueAtTime(1.6, t); n.playbackRate.linearRampToValueAtTime(0.4, t + 0.12); n.playbackRate.linearRampToValueAtTime(1.8, t + 0.24);
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2200; f.Q.value = 4;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    n.connect(f); f.connect(g); g.connect(dest); n.start(t); n.stop(t + 0.3);
  },
  glitchFX(ctx, dest, t) {
    for (let i = 0; i < 5; i++) { const gt = t + i * 0.04;
      const o = ctx.createOscillator(), g = ctx.createGain(); o.type = 'square';
      o.frequency.value = 200 + Math.random() * 2400; g.gain.setValueAtTime(0.25, gt); g.gain.exponentialRampToValueAtTime(0.0001, gt + 0.03);
      o.connect(g); g.connect(dest); o.start(gt); o.stop(gt + 0.035); }
  },
  reverseCymbal(ctx, dest, t) {
    const dur = 1.0; const n = ctx.createBufferSource(); n.buffer = noiseBuffer(ctx, dur);
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 3000;
    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.55, t + dur - 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.05);
    n.connect(f); f.connect(g); g.connect(dest); n.start(t); n.stop(t + dur);
  },
  noiseSweep(ctx, dest, t) {
    const dur = 0.8; const n = ctx.createBufferSource(); n.buffer = noiseBuffer(ctx, dur);
    const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 2;
    f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(8000, t + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0.4, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    n.connect(f); f.connect(g); g.connect(dest); n.start(t); n.stop(t + dur);
  },
  pluck(ctx, dest, t) {
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sawtooth'; o2.type = 'sawtooth'; o.frequency.value = 329.63; o2.frequency.value = 329.63; o2.detune.value = 14;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(4000, t); f.frequency.exponentialRampToValueAtTime(500, t + 0.3);
    g.gain.setValueAtTime(0.4, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
    o.connect(f); o2.connect(f); f.connect(g); g.connect(dest); o.start(t); o2.start(t); o.stop(t + 0.45); o2.stop(t + 0.45);
  },
  cowbell(ctx, dest, t) {
    const fr = [540, 800]; const out = ctx.createGain(); out.gain.setValueAtTime(0.4, t); out.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    fr.forEach(f => { const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = f; o.connect(out); o.start(t); o.stop(t + 0.35); });
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 800; bp.Q.value = 2; out.connect(bp); bp.connect(dest);
  }
};

/* ============================================================
   PAD CONFIG + default 16-step grooves (so latching = instant beat)
   ============================================================ */
const COL = { p:'var(--purple)', c:'var(--cyan)', r:'var(--red)', g:'var(--green)', o:'var(--orange)' };
function P(str) { return str.split('').map(x => x === 'x' ? 1 : 0); }
const PADS = [
  { lbl:'808',     sub:'warped kick', col:COL.r, snd:'kick808',      pat:P('x.......x..x.....'.slice(0,16)) },
  { lbl:'SNARE',   sub:'clap layer',  col:COL.c, snd:'snareClap',    pat:P('....x.......x...') },
  { lbl:'HAT',     sub:'closed',      col:COL.p, snd:'hatClosed',    pat:P('x.x.x.x.x.x.x.x.') },
  { lbl:'OPEN',    sub:'open hat',    col:COL.c, snd:'hatOpen',      pat:P('..x...x...x...x.') },
  { lbl:'ROLL',    sub:'hat chop',    col:COL.p, snd:'hatRoll',      pat:P('..............xx') },
  { lbl:'CRASH',   sub:'glitch',      col:COL.r, snd:'crashGlitch',  pat:P('x...............') },
  { lbl:'RIM',     sub:'pitch shift', col:COL.o, snd:'rimshot',      pat:P('...x.......x....') },
  { lbl:'SUB',     sub:'bass thud',   col:COL.r, snd:'subThud',      pat:P('x.......x.......') },
  { lbl:'PAD',     sub:'dark atmos',  col:COL.p, snd:'darkPad',      pat:P('x...............') },
  { lbl:'BELL',    sub:'detuned',     col:COL.c, snd:'bellStab',     pat:P('..........x.....') },
  { lbl:'SCRATCH', sub:'vinyl stab',  col:COL.o, snd:'vinylScratch', pat:P('......x.......x.') },
  { lbl:'GLITCH',  sub:'digital fx',  col:COL.g, snd:'glitchFX',     pat:P('.............x..') },
  { lbl:'REV CYM', sub:'reverse',     col:COL.c, snd:'reverseCymbal',pat:P('........x.......') },
  { lbl:'SWEEP',   sub:'noise',       col:COL.g, snd:'noiseSweep',   pat:P('x...............') },
  { lbl:'PLUCK',   sub:'melodic',     col:COL.p, snd:'pluck',        pat:P('..x...x...x...x.') },
  { lbl:'COWBELL', sub:'phonk',       col:COL.o, snd:'cowbell',      pat:P('....x.......x...') },
];
const STEPS = 16;
// live editable patterns + latch state
let patterns = PADS.map(p => p.pat.slice());
let latched = PADS.map(() => false);

/* ============================================================
   UI — pad grid
   ============================================================ */
const grid = document.getElementById('grid');
const padEls = [];
let mode = 'loop';          // loop | tap | edit
let selectedPad = 0;

PADS.forEach((p, i) => {
  const el = document.createElement('div');
  el.className = 'pad'; el.style.setProperty('--c', p.col);
  el.innerHTML = `<div class="num">${String(i+1).padStart(2,'0')}</div>
    <div class="loopbadge">● LOOP</div>
    <div class="lbl">${p.lbl}</div><div class="sub">${p.sub}</div>`;
  grid.appendChild(el); padEls.push(el);
  const fire = (e) => { e.preventDefault(); onPad(i); };
  el.addEventListener('touchstart', fire, { passive:false });
  el.addEventListener('mousedown', fire);
});

function onPad(i) {
  initAudio(); if (AC.state === 'suspended') AC.resume();
  if (mode === 'tap') { triggerPad(i); return; }
  if (mode === 'edit') { selectPad(i); triggerPad(i); return; }
  // loop mode: toggle latch
  latched[i] = !latched[i];
  padEls[i].classList.toggle('latched', latched[i]);
  if (latched[i] && !playing) startTransport();
  if (latched[i]) triggerPad(i); // immediate feedback
}

function selectPad(i) {
  selectedPad = i;
  padEls.forEach((el, idx) => el.classList.toggle('selected', idx === i));
  document.getElementById('stepLbl').textContent = PADS[i].lbl;
  renderStepBar();
}

function flashPad(i) { const el = padEls[i]; el.classList.add('active'); setTimeout(() => el.classList.remove('active'), 110); }
function triggerPad(i, scheduledTime) {
  const t = scheduledTime != null ? scheduledTime : AC.currentTime;
  SOUNDS[PADS[i].snd](AC, busIn, t);
  const delay = scheduledTime != null ? Math.max(0, (scheduledTime - AC.currentTime) * 1000) : 0;
  setTimeout(() => flashPad(i), delay);
}

/* ============================================================
   TRANSPORT — always-looping 16-step clock
   ============================================================ */
let bpm = 140, playing = false, currentStep = 0, nextNoteTime = 0, schedulerTimer = null;
function stepDurSec() { return (60 / bpm) / 4; } // 16th notes

const stepsWrap = document.getElementById('steps');
const stepLights = [];
for (let i = 0; i < STEPS; i++) {
  const s = document.createElement('div'); s.className = 'steplight';
  s.addEventListener('touchstart', (e) => { e.preventDefault(); onStep(i); }, { passive:false });
  s.addEventListener('mousedown', (e) => { e.preventDefault(); onStep(i); });
  stepsWrap.appendChild(s); stepLights.push(s);
}
function onStep(i) {
  if (mode !== 'edit') return;
  patterns[selectedPad][i] = patterns[selectedPad][i] ? 0 : 1;
  if (!latched[selectedPad]) { latched[selectedPad] = true; padEls[selectedPad].classList.add('latched'); }
  if (!playing) startTransport();
  renderStepBar();
}
function renderStepBar() {
  const editing = mode === 'edit';
  const col = editing ? PADS[selectedPad].col : COL.p;
  stepLights.forEach((s, i) => {
    s.style.setProperty('--sc', col);
    const on = editing ? patterns[selectedPad][i] : false;
    s.classList.toggle('on', !!on);
  });
}

function scheduler() {
  const lookahead = 0.1;
  while (nextNoteTime < AC.currentTime + lookahead) {
    const step = currentStep, when = nextNoteTime;
    for (let i = 0; i < PADS.length; i++) if (latched[i] && patterns[i][step]) triggerPad(i, when);
    const delay = (when - AC.currentTime) * 1000;
    setTimeout(() => {
      stepLights.forEach((s, idx) => s.classList.toggle('head', idx === step));
    }, Math.max(0, delay));
    nextNoteTime += stepDurSec(); currentStep = (currentStep + 1) % STEPS;
  }
  schedulerTimer = setTimeout(scheduler, 25);
}
function startTransport() {
  initAudio(); if (AC.state === 'suspended') AC.resume();
  playing = true; currentStep = 0; nextNoteTime = AC.currentTime + 0.06; scheduler();
  btnPlay.classList.add('on'); btnPlay.textContent = '■ STOP';
}
function stopTransport() {
  playing = false; clearTimeout(schedulerTimer);
  stepLights.forEach(s => s.classList.remove('head'));
  btnPlay.classList.remove('on'); btnPlay.textContent = '▶ PLAY';
}

/* ============================================================
   CONTROLS
   ============================================================ */
const btnPlay = document.getElementById('btnPlay');
const modeTxt = document.getElementById('modeTxt');
btnPlay.addEventListener('click', () => { initAudio(); playing ? stopTransport() : startTransport(); });

document.querySelectorAll('#modes button').forEach(b => {
  b.addEventListener('click', () => {
    mode = b.dataset.mode;
    document.querySelectorAll('#modes button').forEach(x => x.classList.toggle('on', x === b));
    modeTxt.textContent = mode.toUpperCase();
    if (mode === 'edit') selectPad(selectedPad);
    else { padEls.forEach(el => el.classList.remove('selected')); document.getElementById('stepLbl').textContent = 'LOOP'; renderStepBar(); }
  });
});

document.getElementById('btnLofi').addEventListener('click', (e) => {
  initAudio(); setLofi(!lofiOn); e.currentTarget.classList.toggle('on', lofiOn);
});

document.getElementById('btnClr').addEventListener('click', () => {
  latched = PADS.map(() => false); patterns = PADS.map(p => p.pat.map(() => 0));
  padEls.forEach(el => el.classList.remove('latched')); renderStepBar(); toast('cleared');
});

/* ---------- save / load (localStorage) ---------- */
function snapshot() { return { bpm, reverbAmount, driveAmount, filterAmount, lofiOn, patterns, latched }; }
document.getElementById('btnSave').addEventListener('click', () => {
  localStorage.setItem('looper.preset', JSON.stringify(snapshot())); toast('saved');
});
document.getElementById('btnLoad').addEventListener('click', () => {
  const raw = localStorage.getItem('looper.preset'); if (!raw) { toast('no preset'); return; }
  const s = JSON.parse(raw); initAudio();
  patterns = s.patterns; latched = s.latched;
  bpm = s.bpm; setReverb(s.reverbAmount); setDrive(s.driveAmount); setFilter(s.filterAmount); setLofi(s.lofiOn);
  bpmKnob.set(bpm); reverbKnob.set(s.reverbAmount*100); driveKnob.set(s.driveAmount*100); filterKnob.set(s.filterAmount*100);
  document.getElementById('bpmNum').textContent = bpm;
  document.getElementById('btnLofi').classList.toggle('on', lofiOn);
  padEls.forEach((el, i) => el.classList.toggle('latched', latched[i]));
  renderStepBar(); toast('loaded');
  if (latched.some(Boolean) && !playing) startTransport();
});

/* ---------- WAV export (offline render of 2 bars) ---------- */
document.getElementById('btnWav').addEventListener('click', exportWav);
async function exportWav() {
  if (!latched.some(Boolean)) { toast('latch a pad first'); return; }
  toast('rendering…');
  const bars = 2, rate = 44100, dur = stepDurSec() * STEPS * bars + 1.2;
  const offline = new OfflineAudioContext(2, Math.ceil(dur * rate), rate);
  const ch = buildChain(offline);
  ch.driveNode.curve = makeDriveCurve(driveAmount); ch.driveWet.gain.value = driveAmount * 0.9; ch.driveDry.gain.value = 1 - driveAmount * 0.5;
  ch.wetGain.gain.value = reverbAmount; ch.dryGain.gain.value = 1 - reverbAmount * 0.4;
  ch.masterFilter.frequency.value = 300 * Math.pow(60, lofiOn ? Math.min(filterAmount,0.45) : filterAmount);
  ch.lofiNode.curve = lofiOn ? makeCrushCurve(6) : makeLinearCurve();
  const sd = stepDurSec();
  for (let bar = 0; bar < bars; bar++) for (let step = 0; step < STEPS; step++) {
    const t = (bar * STEPS + step) * sd;
    for (let i = 0; i < PADS.length; i++) if (latched[i] && patterns[i][step]) SOUNDS[PADS[i].snd](offline, ch.busIn, t);
  }
  const buf = await offline.startRendering();
  const blob = new Blob([encodeWAV(buf)], { type: 'audio/wav' });
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = `looper-${bpm}bpm.wav`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000); toast('exported WAV');
}
function encodeWAV(buf) {
  const nCh = buf.numberOfChannels, len = buf.length, rate = buf.sampleRate;
  const ab = new ArrayBuffer(44 + len * nCh * 2), v = new DataView(ab);
  const wr = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  wr(0,'RIFF'); v.setUint32(4, 36 + len*nCh*2, true); wr(8,'WAVE'); wr(12,'fmt '); v.setUint32(16,16,true);
  v.setUint16(20,1,true); v.setUint16(22,nCh,true); v.setUint32(24,rate,true); v.setUint32(28,rate*nCh*2,true);
  v.setUint16(32,nCh*2,true); v.setUint16(34,16,true); wr(36,'data'); v.setUint32(40,len*nCh*2,true);
  let off = 44; const chans = []; for (let c = 0; c < nCh; c++) chans.push(buf.getChannelData(c));
  for (let i = 0; i < len; i++) for (let c = 0; c < nCh; c++) {
    let s = Math.max(-1, Math.min(1, chans[c][i])); v.setInt16(off, s < 0 ? s*0x8000 : s*0x7FFF, true); off += 2;
  }
  return ab;
}

/* ============================================================
   KNOBS & BPM DIAL
   ============================================================ */
function makeKnob(el, valEl, min, max, value, fmt, onChange) {
  let v = value;
  const update = () => { const norm = (v - min) / (max - min); el.style.setProperty('--rot', (-135 + norm * 270) + 'deg');
    if (valEl) valEl.textContent = fmt(v); onChange(v); };
  update();
  let startY = 0, startV = 0;
  const move = (e) => { e.preventDefault(); const y = e.touches ? e.touches[0].clientY : e.clientY;
    v = Math.min(max, Math.max(min, startV + (startY - y) * (max - min) / 180)); update(); };
  const up = () => { window.removeEventListener('touchmove', move); window.removeEventListener('mousemove', move);
    window.removeEventListener('touchend', up); window.removeEventListener('mouseup', up); };
  const down = (e) => { e.preventDefault(); initAudio(); startY = e.touches ? e.touches[0].clientY : e.clientY; startV = v;
    window.addEventListener('touchmove', move, { passive:false }); window.addEventListener('mousemove', move);
    window.addEventListener('touchend', up); window.addEventListener('mouseup', up); };
  el.addEventListener('touchstart', down, { passive:false }); el.addEventListener('mousedown', down);
  return { set: (nv) => { v = nv; update(); } };
}
const reverbKnob = makeKnob(document.getElementById('kReverb'), document.getElementById('vReverb'), 0, 100, 20, v => Math.round(v), v => setReverb(v/100));
const driveKnob  = makeKnob(document.getElementById('kDrive'),  document.getElementById('vDrive'),  0, 100, 15, v => Math.round(v), v => setDrive(v/100));
const filterKnob = makeKnob(document.getElementById('kFilter'), document.getElementById('vFilter'), 0, 100, 100, v => Math.round(v), v => setFilter(v/100));
const bpmKnob    = makeKnob(document.getElementById('bpmDial'), null, 80, 160, 140, v => Math.round(v), v => { bpm = Math.round(v); document.getElementById('bpmNum').textContent = bpm; });

/* ============================================================
   FX flash + toast + keyboard
   ============================================================ */
const flashEl = document.getElementById('flash');
function flash() { flashEl.style.transition='none'; flashEl.style.opacity='0.25';
  requestAnimationFrame(() => { flashEl.style.transition='opacity .18s'; flashEl.style.opacity='0'; }); }
let toastTimer = null;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1200); }

const KEYMAP = ['1','2','3','4','q','w','e','r','a','s','d','f','z','x','c','v'];
window.addEventListener('keydown', (e) => { if (e.repeat) return; const i = KEYMAP.indexOf(e.key.toLowerCase());
  if (i >= 0) onPad(i); if (e.code === 'Space') { e.preventDefault(); initAudio(); playing ? stopTransport() : startTransport(); } });

document.body.addEventListener('touchstart', () => { initAudio(); if (AC && AC.state === 'suspended') AC.resume(); }, { once:true });
renderStepBar();
</script>
</body>
</html>
