<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#08080c" />

<title>LOOPER // RAGE PAD</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');
  :root { --bg:#08080c; --bg2:#0e0e16; --panel:#14141f; --purple:#b026ff; --cyan:#00f0ff; --red:#ff2d55; --green:#39ff14; --orange:#ff9f1c; --txt:#e8e8f0; --dim:#6a6a82; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; }
  html, body { height:100%; background:var(--bg); color:var(--txt); font-family:'Share Tech Mono',monospace; overflow:hidden; overscroll-behavior:none; touch-action:manipulation; }
  body { display:flex; flex-direction:column; position:relative; z-index:1;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    background: radial-gradient(circle at 20% 0%, rgba(176,38,255,0.10), transparent 45%), radial-gradient(circle at 90% 100%, rgba(0,240,255,0.08), transparent 45%), var(--bg); }
  #viz { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.5; }
  header, main, .controls { position:relative; z-index:2; }
  header { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; padding:8px 16px 4px; }
  .logo { font-family:'Orbitron',sans-serif; font-weight:900; font-size:21px; letter-spacing:2px; color:#fff; text-shadow:0 0 8px var(--purple),0 0 18px rgba(176,38,255,0.6); position:relative; }
  .logo span { color:var(--cyan); text-shadow:0 0 8px var(--cyan); }
  .logo.glitch::after { content:'LOOPER'; position:absolute; left:2px; top:0; color:var(--red); opacity:.7; clip-path:inset(0 0 60% 0); animation:glitch 1.6s infinite steps(2); pointer-events:none; }
  @keyframes glitch { 0%,90%,100%{transform:translate(0,0)} 92%{transform:translate(-2px,1px)} 94%{transform:translate(2px,-1px)} 96%{transform:translate(-1px,0)} }
  .status { font-size:11px; color:var(--dim); text-align:right; line-height:1.4; }
  .status b { color:var(--green); }
  .grid { flex:1 1 auto; display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr); gap:7px; padding:6px 12px; min-height:0; }
  .pad { position:relative; border-radius:14px; background:linear-gradient(160deg,rgba(20,20,31,0.92),rgba(14,14,22,0.92)); border:1px solid rgba(255,255,255,0.06); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; overflow:hidden; cursor:pointer; transition:transform .04s ease, box-shadow .12s ease; --c:var(--purple); }
  .pad::before { content:''; position:absolute; inset:0; border-radius:14px; background:radial-gradient(circle at 50% 120%,var(--c),transparent 70%); opacity:.16; pointer-events:none; transition:opacity .15s; }
  .pad .num { position:absolute; top:5px; left:8px; font-size:10px; color:var(--dim); }
  .pad .lbl { font-size:12px; font-weight:700; letter-spacing:.5px; color:#fff; text-shadow:0 0 6px var(--c); padding:0 4px; z-index:2; line-height:1.1; }
  .pad .sub { font-size:9px; color:var(--dim); margin-top:2px; z-index:2; }
  .pad.active { transform:scale(0.94); box-shadow:0 0 18px var(--c),0 0 40px var(--c), inset 0 0 22px rgba(255,255,255,0.08); }
  .pad.active::before { opacity:.55; }
  .pad.latched { border-color:var(--c); box-shadow:0 0 14px var(--c), inset 0 0 18px rgba(255,255,255,0.04); }
  .pad.latched::before { opacity:.4; }
  .pad .loopbadge { position:absolute; top:5px; right:7px; font-size:8px; letter-spacing:.5px; color:var(--c); opacity:0; text-shadow:0 0 6px var(--c); }
  .pad.latched .loopbadge { opacity:1; }
  .pad.selected { outline:2px dashed var(--c); outline-offset:-4px; }
  .pad.muted { opacity:0.4; }
  .pad .mutemark { position:absolute; bottom:5px; right:7px; font-size:9px; color:var(--red); opacity:0; }
  .pad.muted .mutemark { opacity:1; }
  .controls { flex:0 0 auto; background:linear-gradient(180deg,rgba(20,20,31,0.7),rgba(10,10,18,0.97)); border-top:1px solid rgba(176,38,255,0.25); padding:8px 12px calc(8px + env(safe-area-inset-bottom)); }
  .row { display:flex; align-items:center; gap:9px; margin-bottom:8px; }
  .row.wrap { flex-wrap:wrap; }
  .row:last-child { margin-bottom:0; }
  .steplbl { font-size:9px; color:var(--dim); width:48px; text-align:right; letter-spacing:.5px; cursor:pointer; }
  .steps { display:flex; gap:3px; align-items:center; flex:1 1 auto; }
  .steplight { flex:1 1 0; height:14px; border-radius:3px; background:#1c1c2a; border:1px solid #262638; transition:background .05s, box-shadow .05s; position:relative; }
  .steplight.on { background:var(--sc,var(--purple)); box-shadow:0 0 8px var(--sc,var(--purple)); }
  .steplight.beat { border-color:#3a3a52; }
  .steplight.head::after { content:''; position:absolute; inset:0; border-radius:3px; border:1px solid #fff; opacity:.9; }
  .knobrow { display:flex; align-items:center; gap:9px; overflow-x:auto; flex:1 1 auto; padding-bottom:2px; }
  .knobrow::-webkit-scrollbar { height:0; }
  .knobwrap { display:flex; flex-direction:column; align-items:center; gap:2px; flex:0 0 auto; }
  .knob { width:44px; height:44px; border-radius:50%; background:radial-gradient(circle at 50% 40%,#20202e,#0a0a12); border:2px solid var(--c,var(--purple)); position:relative; box-shadow:0 0 10px rgba(176,38,255,0.4), inset 0 2px 6px rgba(0,0,0,0.6); touch-action:none; --c:var(--purple); }
  .knob.cyan{--c:var(--cyan)} .knob.red{--c:var(--red)} .knob.orange{--c:var(--orange)} .knob.green{--c:var(--green)}
  .knob::after { content:''; position:absolute; left:50%; top:5px; width:3px; height:13px; border-radius:2px; background:var(--c); transform-origin:50% 17px; transform:translateX(-50%) rotate(var(--rot,-135deg)); box-shadow:0 0 6px var(--c); }
  .knob .val { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#fff; pointer-events:none; text-shadow:0 0 6px var(--c); }
  .klabel { font-size:8px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; }
  .bpmdial { width:56px; height:56px; border-radius:50%; background:radial-gradient(circle at 50% 40%,#1a1a28,#060609); border:2px solid var(--cyan); position:relative; box-shadow:0 0 14px rgba(0,240,255,0.5), inset 0 2px 8px rgba(0,0,0,0.7); touch-action:none; }
  .bpmdial::after { content:''; position:absolute; left:50%; top:4px; width:3px; height:18px; border-radius:2px; background:var(--cyan); box-shadow:0 0 8px var(--cyan); transform-origin:50% 24px; transform:translateX(-50%) rotate(var(--rot,-135deg)); }
  .bpmval { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
  .bpmval b { font-family:'Orbitron'; font-size:15px; color:#fff; text-shadow:0 0 8px var(--cyan); }
  .bpmval small { font-size:7px; color:var(--dim); letter-spacing:1px; }
  .spacer { flex:1 1 auto; }
  .col { display:flex; flex-direction:column; gap:5px; flex:0 0 auto; }
  .btn { font-family:'Orbitron',sans-serif; font-weight:700; font-size:11px; letter-spacing:1px; padding:9px 10px; border-radius:9px; background:var(--panel); color:var(--txt); border:1px solid rgba(255,255,255,0.12); cursor:pointer; transition:all .12s ease; text-transform:uppercase; }
  .btn:active { transform:scale(0.95); }
  .btn.sm { font-size:10px; padding:7px 8px; }
  .btn.play { color:var(--green); border-color:var(--green); }
  .btn.play.on { background:var(--green); color:#000; box-shadow:0 0 16px var(--green); }
  .btn.lofi.on { background:var(--orange); color:#000; border-color:var(--orange); box-shadow:0 0 12px var(--orange); }
  .btn.bars { color:var(--cyan); border-color:var(--cyan); min-width:58px; }
  .btn.bank { color:var(--purple); border-color:var(--purple); min-width:64px; }
  .btn.song.on { background:var(--purple); color:#fff; border-color:var(--purple); box-shadow:0 0 14px var(--purple); }
  .btn.store.on { background:var(--orange); color:#000; border-color:var(--orange); box-shadow:0 0 12px var(--orange); }
  .scene { width:34px; color:var(--dim); }
  .scene.filled { color:var(--cyan); border-color:var(--cyan); }
  .scene.cur { background:var(--cyan); color:#000; box-shadow:0 0 12px var(--cyan); }
  .modes { display:flex; border:1px solid rgba(255,255,255,0.12); border-radius:9px; overflow:hidden; flex:0 0 auto; }
  .modes button { font-family:'Orbitron',sans-serif; font-weight:700; font-size:10px; letter-spacing:1px; padding:9px 9px; background:transparent; color:var(--dim); border:none; cursor:pointer; }
  .modes button.on { color:#000; background:var(--cyan); box-shadow:0 0 12px var(--cyan); }
  #flash { position:fixed; inset:0; pointer-events:none; z-index:99; background:var(--cyan); opacity:0; mix-blend-mode:screen; }
  #toast { position:fixed; left:50%; bottom:32%; transform:translateX(-50%); background:rgba(10,10,18,0.96); border:1px solid var(--cyan); color:#fff; padding:10px 18px; border-radius:10px; font-size:13px; z-index:200; box-shadow:0 0 20px rgba(0,240,255,0.4); opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.show { opacity:1; }
  #panel { position:fixed; inset:0; z-index:300; background:rgba(4,4,8,0.78); display:none; align-items:flex-end; justify-content:center; }
  #panel.show { display:flex; }
  .panel-card { width:100%; max-width:520px; background:linear-gradient(180deg,#16162280,#0a0a12); border-top:2px solid var(--pc,var(--purple)); border-radius:18px 18px 0 0; padding:18px 20px calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -8px 40px rgba(0,0,0,0.7); }
  .panel-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .panel-head .pname { font-family:'Orbitron'; font-weight:900; font-size:20px; color:#fff; text-shadow:0 0 10px var(--pc,var(--purple)); }
  .slider-row { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
  .slider-row label { width:62px; font-size:11px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; }
  .slider-row .num { width:50px; text-align:right; font-size:13px; color:#fff; }
  input[type=range] { -webkit-appearance:none; flex:1 1 auto; height:6px; border-radius:3px; background:#26263a; outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:var(--pc,var(--purple)); box-shadow:0 0 10px var(--pc,var(--purple)); cursor:pointer; }
  .panel-btns { display:flex; gap:10px; margin-top:6px; }
  .panel-btns .btn { flex:1 1 0; }
  .btn.mute.on { background:var(--red); color:#fff; border-color:var(--red); box-shadow:0 0 12px var(--red); }
  .btn.fx { color:var(--orange); border-color:var(--orange); }
  .btn.fx.on { background:var(--orange); color:#000; box-shadow:0 0 14px var(--orange); }
  .btn.mixbtn { color:var(--green); border-color:var(--green); }
  /* mixer overlay */
  #mixer { position:fixed; inset:0; z-index:300; background:rgba(4,4,8,0.85); display:none; align-items:flex-end; justify-content:center; }
  #mixer.show { display:flex; }
  .mixer-card { width:100%; max-width:760px; max-height:80%; background:linear-gradient(180deg,#16162280,#0a0a12); border-top:2px solid var(--cyan); border-radius:18px 18px 0 0; padding:16px 16px calc(16px + env(safe-area-inset-bottom)); box-shadow:0 -8px 40px rgba(0,0,0,0.7); display:flex; flex-direction:column; }
  .mixer-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .mixer-head .pname { font-family:'Orbitron'; font-weight:900; font-size:18px; color:#fff; text-shadow:0 0 10px var(--cyan); }
  .mixer-strips { display:grid; grid-template-columns:repeat(auto-fill,minmax(58px,1fr)); gap:8px; overflow-y:auto; }
  .strip { display:flex; flex-direction:column; align-items:center; gap:5px; padding:7px 3px; border-radius:9px; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.07); }
  .strip .sl { font-size:8px; color:#fff; text-shadow:0 0 5px var(--c); text-align:center; line-height:1; height:18px; overflow:hidden; --c:var(--purple); }
  .strip input[type=range]{ writing-mode:vertical-lr; direction:rtl; width:8px; height:80px; }
  .strip input[type=range]::-webkit-slider-thumb{ width:18px; height:14px; border-radius:3px; }
  .strip .ms { display:flex; gap:3px; }
  .strip .mini { font-family:'Orbitron'; font-size:9px; font-weight:700; padding:3px 5px; border-radius:5px; border:1px solid rgba(255,255,255,0.15); background:transparent; color:var(--dim); cursor:pointer; }
  .strip .mini.m.on { background:var(--red); color:#fff; border-color:var(--red); }
  .strip .mini.s.on { background:var(--cyan); color:#000; border-color:var(--cyan); }
</style>
</head>
<body>
  <canvas id="viz"></canvas>
  <div id="flash"></div>
  <div id="toast"></div>
  <header>
    <div class="logo glitch">LOO<span>PER</span></div>
    <div class="status"><div>MODE <b id="modeTxt">LOOP</b></div><div id="engineTxt">tap to start</div></div>
  </header>
  <main class="grid" id="grid"></main>
  <section class="controls">
    <div class="row"><div class="steplbl" id="stepLbl">LOOP</div><div class="steps" id="steps"></div></div>
    <div class="row">
      <div class="knobrow">
        <div class="knobwrap"><div class="bpmdial" id="bpmDial"><div class="bpmval"><b id="bpmNum">140</b><small>BPM</small></div></div></div>
        <div class="knobwrap"><div class="knob" id="kReverb"><div class="val" id="vReverb">28</div></div><div class="klabel">Verb</div></div>
        <div class="knobwrap"><div class="knob red" id="kDrive"><div class="val" id="vDrive">22</div></div><div class="klabel">Drive</div></div>
        <div class="knobwrap"><div class="knob cyan" id="kFilter"><div class="val" id="vFilter">100</div></div><div class="klabel">Filter</div></div>
        <div class="knobwrap"><div class="knob green" id="kSwing"><div class="val" id="vSwing">0</div></div><div class="klabel">Swing</div></div>
        <div class="knobwrap"><div class="knob orange" id="kPump"><div class="val" id="vPump">0</div></div><div class="klabel">Pump</div></div>
        <div class="knobwrap"><div class="knob red" id="kScrew"><div class="val" id="vScrew">0</div></div><div class="klabel">Screw</div></div>
      </div>
      <div class="col"><button class="btn play" id="btnPlay">▶ PLAY</button><button class="btn lofi sm" id="btnLofi">LO-FI</button></div>
    </div>
    <div class="row wrap">
      <div class="modes" id="modes"><button data-mode="loop" class="on">LOOP</button><button data-mode="tap">TAP</button><button data-mode="edit">EDIT</button></div>
      <button class="btn bank sm" id="btnBank">BANK A</button>
      <button class="btn bars sm" id="btnBars">1 BAR</button>
      <div class="spacer"></div>
      <button class="btn sm" id="btnSave">SAVE</button>
      <button class="btn sm" id="btnLoad">LOAD</button>
      <button class="btn sm" id="btnWav">WAV</button>
      <button class="btn sm" id="btnClr">CLR</button>
    </div>
    <div class="row wrap">
      <button class="btn song sm" id="btnSong">SONG</button>
      <button class="btn store sm" id="btnStore">STORE</button>
      <button class="btn scene sm" data-s="0">S1</button>
      <button class="btn scene sm" data-s="1">S2</button>
      <button class="btn scene sm" data-s="2">S3</button>
      <button class="btn scene sm" data-s="3">S4</button>
      <div class="spacer"></div>
      <button class="btn mixbtn sm" id="btnMix">MIX</button>
      <button class="btn fx sm" id="btnStut">STUT</button>
      <button class="btn fx sm" id="btnTape">TAPE</button>
    </div>
  </section>
  <div id="mixer"><div class="mixer-card" id="mixerCard">
    <div class="mixer-head"><div class="pname">MIXER</div><button class="btn play sm" id="mixClose">DONE</button></div>
    <div class="mixer-strips" id="mixStrips"></div>
  </div></div>
  <div id="panel"><div class="panel-card" id="panelCard">
    <div class="panel-head"><div class="pname" id="pName">PAD</div><button class="btn sm" id="pPlay">▷ TEST</button></div>
    <div class="slider-row"><label>Volume</label><input type="range" id="sVol" min="0" max="150" value="100"><div class="num" id="nVol">100%</div></div>
    <div class="slider-row"><label>Pitch</label><input type="range" id="sPitch" min="-12" max="12" value="0"><div class="num" id="nPitch">0 st</div></div>
    <div class="slider-row"><label>Decay</label><input type="range" id="sDecay" min="10" max="100" value="100"><div class="num" id="nDecay">100%</div></div>
    <div class="panel-btns"><button class="btn mute" id="pMute">MUTE</button><button class="btn" id="pReset">RESET</button><button class="btn play" id="pClose">DONE</button></div>
  </div></div>

<script>
"use strict";
/* ============================================================
   LOOPER // RAGE PAD — Web Audio DJ-looper / sampler engine
   32 pads (2 banks) · sidechain pump · scenes + song mode
   ============================================================ */
let AC=null, busIn, master, comp, pumpNode, driveNode, driveDry, driveWet, postDrive, masterFilter, lofiNode, convolver, dryGain, wetGain, analyser;
let reverbAmount=0.28, driveAmount=0.22, filterAmount=1.0, lofiOn=false, pumpAmt=0;

function initAudio() {
  if (AC) return;
  AC = new (window.AudioContext || window.webkitAudioContext)();
  const c = buildChain(AC);
  ({ busIn, master, comp, pumpNode, driveNode, driveDry, driveWet, postDrive, masterFilter, lofiNode, convolver, dryGain, wetGain } = c);
  analyser = AC.createAnalyser(); analyser.fftSize = 256; master.connect(analyser);
  setDrive(driveAmount); setReverb(reverbAmount); setFilter(filterAmount); setLofi(lofiOn);
  for (let i=0;i<NP;i++){ padGain[i]=AC.createGain(); padGain[i].gain.value=volume[i]; padGain[i].connect(busIn); }
  document.getElementById('engineTxt').innerHTML = '<b>ENGINE ON</b>';
  renderPadBuffers(); startViz();
}
function buildChain(ctx) {
  const busIn = ctx.createGain();
  const driveNode = ctx.createWaveShaper(); driveNode.oversample='4x';
  const driveDry = ctx.createGain(), driveWet = ctx.createGain(), postDrive = ctx.createGain();
  const masterFilter = ctx.createBiquadFilter(); masterFilter.type='lowpass'; masterFilter.frequency.value=18000;
  const lofiNode = ctx.createWaveShaper(); lofiNode.oversample='none';
  const convolver = ctx.createConvolver(); convolver.buffer = makeImpulse(ctx, 2.4, 2.6);
  const dryGain = ctx.createGain(), wetGain = ctx.createGain();
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value=-10; comp.knee.value=20; comp.ratio.value=8; comp.attack.value=0.003; comp.release.value=0.18;
  const pumpNode = ctx.createGain(); pumpNode.gain.value=1;
  const master = ctx.createGain(); master.gain.value=0.9;
  const limiter = ctx.createDynamicsCompressor(); limiter.threshold.value=-2; limiter.knee.value=0; limiter.ratio.value=20; limiter.attack.value=0.002; limiter.release.value=0.12;
  busIn.connect(driveDry); busIn.connect(driveNode); driveNode.connect(driveWet);
  driveDry.connect(postDrive); driveWet.connect(postDrive);
  postDrive.connect(masterFilter); masterFilter.connect(lofiNode);
  lofiNode.connect(dryGain); lofiNode.connect(convolver); convolver.connect(wetGain);
  dryGain.connect(comp); wetGain.connect(comp); comp.connect(pumpNode); pumpNode.connect(master); master.connect(limiter); limiter.connect(ctx.destination);
  return { busIn, master, comp, pumpNode, driveNode, driveDry, driveWet, postDrive, masterFilter, lofiNode, convolver, dryGain, wetGain, limiter };
}
function makeDriveCurve(a){ const k=a*100,n=1024,c=new Float32Array(n); for(let i=0;i<n;i++){const x=(i*2)/n-1; c[i]=(Math.PI+k)*x/(Math.PI+k*Math.abs(x));} return c; }
function makeCrushCurve(b){ const n=1024,c=new Float32Array(n),s=Math.pow(0.5,b); for(let i=0;i<n;i++){const x=(i*2)/n-1; c[i]=s*Math.floor(x/s+0.5);} return c; }
function makeLinearCurve(){ const c=new Float32Array(2); c[0]=-1; c[1]=1; return c; }
function makeImpulse(ctx,dur,decay){ const r=ctx.sampleRate,len=r*dur,imp=ctx.createBuffer(2,len,r); for(let ch=0;ch<2;ch++){const d=imp.getChannelData(ch); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);} return imp; }
function setDrive(v){ driveAmount=v; if(!AC)return; driveNode.curve=makeDriveCurve(v); driveWet.gain.value=v*0.9; driveDry.gain.value=1-v*0.5; }
function setReverb(v){ reverbAmount=v; if(!AC)return; wetGain.gain.value=v; dryGain.gain.value=1-v*0.4; }

function setLofi(on){ lofiOn=on; if(!AC)return; lofiNode.curve=on?makeCrushCurve(6):makeLinearCurve(); setFilter(filterAmount); }

/* tanh soft-clip curve for analog-style saturation (the rage 808 grit) */
function satCurve(k){ const n=1024,c=new Float32Array(n); for(let i=0;i<n;i++){const x=(i*2)/n-1; c[i]=Math.tanh(k*x);} return c; }
/* 808/909-style metallic hat: 6 inharmonic square partials through band/high-pass */
function metalHat(ctx,dest,t,dur,level){ const out=ctx.createGain(); out.gain.setValueAtTime(level,t); out.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=9000; bp.Q.value=0.6;
  const hp=ctx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=7200;
  const fund=40, ratios=[2,3,4.16,5.43,6.79,8.21];
  ratios.forEach(r=>{ const o=ctx.createOscillator(); o.type='square'; o.frequency.value=fund*r; o.connect(bp); o.start(t); o.stop(t+dur+0.02); });
  bp.connect(hp); hp.connect(out); out.connect(dest); }

  {lbl:'GLASS',sub:'glass hit',col:COL.c,snd:'glassHit',pat:'..........x.....'},

const PADS = BANK_A.concat(BANK_B);
const NP = PADS.length, MAXSTEPS=64;
let patterns = PADS.map(p=>tile(P(p.pat)));
let latched = PADS.map(()=>false);
let volume = PADS.map(()=>1), pitch = PADS.map(()=>0), decay = PADS.map(()=>1), muted = PADS.map(()=>false), soloed = PADS.map(()=>false);
let padGain = new Array(NP), padBuffers = new Array(NP), buffersReady=false;
let screwRate = 1.0;                 // global chopped-and-screwed pitch/tempo (0.5..1)
const activeSrc = new Set();         // live buffer sources, for the tape-stop effect
function anySolo(){ return soloed.some(Boolean); }
function audible(g){ return !muted[g] && (!anySolo() || soloed[g]); }

async function renderPadBuffers(){ const rate=AC.sampleRate;
  for(let i=0;i<NP;i++){ const dur=(SOUND_DUR[PADS[i].snd]||1)+0.1; const off=new OfflineAudioContext(2,Math.ceil(dur*rate),rate); SOUNDS[PADS[i].snd](off,off.destination,0); padBuffers[i]=await off.startRendering(); } buffersReady=true; }

/* ---------- grid (16 cells paged by bank) ---------- */
const grid=document.getElementById('grid'); const cellEls=[];
let mode='loop', selectedPad=0, bank=0;
function gIndex(slot){ return bank*16 + slot; }
for(let slot=0;slot<16;slot++){
  const el=document.createElement('div'); el.className='pad';
  el.innerHTML=`<div class="num"></div><div class="loopbadge">● LOOP</div><div class="lbl"></div><div class="sub"></div><div class="mutemark">MUTE</div>`;
  grid.appendChild(el); cellEls.push(el);
  let lpTimer=null, lpRevert=null;
  const start=(e)=>{ e.preventDefault(); initAudio(); if(AC.state==='suspended')AC.resume(); haptic(8); const g=gIndex(slot);
    lpRevert=doPadAction(g); lpTimer=setTimeout(()=>{ if(lpRevert)lpRevert(); openPanel(g); haptic(20); },450); };
  const end=()=>clearTimeout(lpTimer);
  el.addEventListener('touchstart',start,{passive:false}); el.addEventListener('touchend',end);
  el.addEventListener('mousedown',start); el.addEventListener('mouseup',end); el.addEventListener('mouseleave',end);
}
function renderPads(){
  for(let slot=0;slot<16;slot++){ const g=gIndex(slot), p=PADS[g], el=cellEls[slot];
    el.style.setProperty('--c',p.col);
    el.querySelector('.num').textContent=String(g+1).padStart(2,'0');
    el.querySelector('.lbl').textContent=p.lbl; el.querySelector('.sub').textContent=p.sub;
    el.classList.toggle('latched',latched[g]); el.classList.toggle('muted',muted[g]);
    el.classList.toggle('selected', mode==='edit' && selectedPad===g);
  }
}
function doPadAction(g){ if(mode==='tap'){ triggerPad(g); return null; } if(mode==='edit'){ selectPad(g); triggerPad(g); return null; } toggleLatch(g); return ()=>toggleLatch(g,true); }
function toggleLatch(g,silent){ latched[g]=!latched[g]; if(Math.floor(g/16)===bank) cellEls[g-bank*16].classList.toggle('latched',latched[g]); if(latched[g]&&!playing) startTransport(); if(latched[g]&&!silent) triggerPad(g); }
function selectPad(g){ selectedPad=g; if(Math.floor(g/16)!==bank){ bank=Math.floor(g/16); btnBank.textContent='BANK '+(bank?'B':'A'); renderPads(); } cellEls.forEach((el,s)=>el.classList.toggle('selected',gIndex(s)===g)); document.getElementById('stepLbl').textContent=PADS[g].lbl; renderStepBar(); }
function flashPad(g){ if(Math.floor(g/16)!==bank)return; const el=cellEls[g-bank*16]; el.classList.add('active'); setTimeout(()=>el.classList.remove('active'),110); }
function triggerPad(g, when){ if(!audible(g))return; const t=when!=null?when:AC.currentTime;
  if(pumpAmt>0 && KICKISH[PADS[g].snd] && pumpNode) duck(pumpNode,t,60/bpm);
  if(buffersReady && padBuffers[g]){ const src=AC.createBufferSource(); src.buffer=padBuffers[g]; src.playbackRate.value=Math.pow(2,pitch[g]/12)*screwRate;
    activeSrc.add(src); src.onended=()=>activeSrc.delete(src);
    if(decay[g]<0.999){ const dur=padBuffers[g].duration/src.playbackRate.value, ed=Math.max(0.05,dur*decay[g]); const dg=AC.createGain(); dg.gain.setValueAtTime(1,t); dg.gain.setValueAtTime(1,t+ed*0.55); dg.gain.exponentialRampToValueAtTime(0.0001,t+ed); src.connect(dg); dg.connect(padGain[g]); src.start(t); src.stop(t+ed+0.05); }
    else { src.connect(padGain[g]); src.start(t); } }
  else { SOUNDS[PADS[g].snd](AC, padGain[g], t); }
  const delay=when!=null?Math.max(0,(when-AC.currentTime)*1000):0; setTimeout(()=>flashPad(g),delay);
}

/* ---------- transport ---------- */
let bpm=140, playing=false, currentStep=0, nextNoteTime=0, schedulerTimer=null, bars=1, loopLen=16, swingAmt=0, editPage=0;
function stepDurSec(){ return (60/bpm)/4/screwRate; }
const stepsWrap=document.getElementById('steps'); const stepLights=[];
for(let i=0;i<16;i++){ const s=document.createElement('div'); s.className='steplight'+(i%4===0?' beat':''); s.addEventListener('touchstart',(e)=>{e.preventDefault();onStep(i);},{passive:false}); s.addEventListener('mousedown',(e)=>{e.preventDefault();onStep(i);}); stepsWrap.appendChild(s); stepLights.push(s); }
function curPage(){ return mode==='edit'?editPage:Math.floor(currentStep/16)%bars; }
function onStep(i){ if(mode!=='edit')return; const idx=editPage*16+i; patterns[selectedPad][idx]=patterns[selectedPad][idx]?0:1; if(!latched[selectedPad]){ latched[selectedPad]=true; renderPads(); } if(!playing)startTransport(); renderStepBar(); }
function renderStepBar(){ const editing=mode==='edit'; const col=editing?PADS[selectedPad].col:COL.p; const page=curPage(); stepLights.forEach((s,i)=>{ s.style.setProperty('--sc',col); const idx=page*16+i; s.classList.toggle('on', editing?!!patterns[selectedPad][idx]:false); }); }
function scheduler(){ const look=0.1;
  while(nextNoteTime < AC.currentTime+look){ const step=currentStep, sd=stepDurSec(); const when=(step%2===1)?nextNoteTime+swingAmt*sd:nextNoteTime;
    for(let i=0;i<NP;i++) if(latched[i]&&patterns[i][step]) triggerPad(i,when);
    const visStep=step, delay=(nextNoteTime-AC.currentTime)*1000;
    setTimeout(()=>{ const page=curPage(); const sp=Math.floor(visStep/16)%bars; stepLights.forEach((s,idx)=>s.classList.toggle('head', page===sp && idx===visStep%16)); if(mode!=='edit'&&bars>1&&visStep%16===0) renderStepBar(); }, Math.max(0,delay));
    nextNoteTime+=sd; currentStep=(currentStep+1)%loopLen;
    if(currentStep===0 && songMode) advanceSong();
  }
  schedulerTimer=setTimeout(scheduler,25);
}
function startTransport(){ initAudio(); if(AC.state==='suspended')AC.resume(); playing=true; currentStep=0; nextNoteTime=AC.currentTime+0.06; scheduler(); btnPlay.classList.add('on'); btnPlay.textContent='■ STOP'; }
function stopTransport(){ playing=false; clearTimeout(schedulerTimer); stepLights.forEach(s=>s.classList.remove('head')); btnPlay.classList.remove('on'); btnPlay.textContent='▶ PLAY'; }

/* ---------- buttons ---------- */
const btnPlay=document.getElementById('btnPlay'), modeTxt=document.getElementById('modeTxt'), btnBank=document.getElementById('btnBank');
btnPlay.addEventListener('click',()=>{ initAudio(); playing?stopTransport():startTransport(); });
document.querySelectorAll('#modes button').forEach(b=>{ b.addEventListener('click',()=>{ mode=b.dataset.mode; document.querySelectorAll('#modes button').forEach(x=>x.classList.toggle('on',x===b)); modeTxt.textContent=mode.toUpperCase(); if(mode==='edit')selectPad(selectedPad); else { renderPads(); document.getElementById('stepLbl').textContent='LOOP'; renderStepBar(); } }); });
btnBank.addEventListener('click',()=>{ bank=bank?0:1; btnBank.textContent='BANK '+(bank?'B':'A'); renderPads(); });
const btnBars=document.getElementById('btnBars');
btnBars.addEventListener('click',()=>{ bars=bars===1?2:bars===2?4:1; loopLen=16*bars; if(editPage>=bars)editPage=0; btnBars.textContent=bars+' BAR'+(bars>1?'S':''); if(currentStep>=loopLen)currentStep=0; renderStepBar(); toast(bars+'-bar loop'); });
document.getElementById('stepLbl').addEventListener('click',()=>{ if(mode==='edit'&&bars>1){ editPage=(editPage+1)%bars; toast('bar '+(editPage+1)+'/'+bars); renderStepBar(); } });
document.getElementById('btnLofi').addEventListener('click',(e)=>{ initAudio(); setLofi(!lofiOn); e.currentTarget.classList.toggle('on',lofiOn); });
document.getElementById('btnClr').addEventListener('click',()=>{ latched=PADS.map(()=>false); patterns=PADS.map(()=>new Array(MAXSTEPS).fill(0)); renderPads(); renderStepBar(); toast('cleared'); });

/* ---------- scenes + song mode ---------- */
let scenes=[null,null,null,null], curScene=-1, songMode=false, storeArm=false;
const sceneBtns=[...document.querySelectorAll('.scene')];
function refreshScenes(){ sceneBtns.forEach((b,s)=>{ b.classList.toggle('filled',!!scenes[s]); b.classList.toggle('cur',curScene===s); }); }
function storeScene(s){ scenes[s]={patterns:patterns.map(a=>a.slice()), latched:latched.slice()}; curScene=s; refreshScenes(); toast('stored S'+(s+1)); }
function applyScene(s,quiet){ const sc=scenes[s]; if(!sc)return; patterns=sc.patterns.map(a=>a.slice()); latched=sc.latched.slice(); curScene=s; renderPads(); renderStepBar(); refreshScenes(); if(!quiet)toast('scene S'+(s+1)); if(latched.some(Boolean)&&!playing)startTransport(); }
function nextFilledScene(from){ for(let k=1;k<=4;k++){ const s=(from+k)%4; if(scenes[s])return s; } return from>=0&&scenes[from]?from:-1; }
function advanceSong(){ const n=nextFilledScene(curScene<0?-1:curScene); if(n>=0){ const sc=scenes[n]; patterns=sc.patterns.map(a=>a.slice()); latched=sc.latched.slice(); curScene=n; /* defer visuals */ setTimeout(()=>{ renderPads(); renderStepBar(); refreshScenes(); },0); } }
sceneBtns.forEach(b=>{ const s=+b.dataset.s;
  b.addEventListener('click',()=>{ initAudio(); if(storeArm){ storeScene(s); storeArm=false; document.getElementById('btnStore').classList.remove('on'); } else if(scenes[s]) applyScene(s); else { storeScene(s); } }); });
document.getElementById('btnStore').addEventListener('click',(e)=>{ storeArm=!storeArm; e.currentTarget.classList.toggle('on',storeArm); toast(storeArm?'tap a slot to store':''); });
document.getElementById('btnSong').addEventListener('click',(e)=>{ songMode=!songMode; e.currentTarget.classList.toggle('on',songMode); if(songMode){ if(!scenes.some(Boolean)) toast('store scenes first'); else { if(curScene<0||!scenes[curScene]) applyScene(nextFilledScene(-1),true); toast('song mode: auto-chaining scenes'); if(!playing)startTransport(); } } else toast('song off'); });

/* ---------- per-pad editor ---------- */
const panel=document.getElementById('panel'); const sVol=document.getElementById('sVol'),sPitch=document.getElementById('sPitch'),sDecay=document.getElementById('sDecay'),nVol=document.getElementById('nVol'),nPitch=document.getElementById('nPitch'),nDecay=document.getElementById('nDecay'),pMute=document.getElementById('pMute'); let panelPad=0;
function openPanel(g){ panelPad=g; document.getElementById('panelCard').style.setProperty('--pc',PADS[g].col); document.getElementById('pName').textContent=PADS[g].lbl; sVol.value=Math.round(volume[g]*100); sPitch.value=pitch[g]; sDecay.value=Math.round(decay[g]*100); nVol.textContent=sVol.value+'%'; nPitch.textContent=(pitch[g]>0?'+':'')+pitch[g]+' st'; nDecay.textContent=sDecay.value+'%'; pMute.classList.toggle('on',muted[g]); panel.classList.add('show'); }
function closePanel(){ panel.classList.remove('show'); }

document.getElementById('pClose').addEventListener('click',closePanel);
panel.addEventListener('click',(e)=>{ if(e.target===panel)closePanel(); });

/* ---------- save / load ---------- */
function snapshot(){ return {bpm,bars,swingAmt,reverbAmount,driveAmount,filterAmount,lofiOn,pumpAmt,patterns,latched,volume,pitch,decay,muted,soloed,scenes}; }
document.getElementById('btnSave').addEventListener('click',()=>{ localStorage.setItem('looper.preset',JSON.stringify(snapshot())); toast('saved'); });

  bpm=s.bpm; bars=s.bars||1; loopLen=16*bars; swingAmt=s.swingAmt||0; pumpAmt=s.pumpAmt||0;

  bpmKnob.set(bpm); reverbKnob.set(s.reverbAmount*100); driveKnob.set(s.driveAmount*100); filterKnob.set(s.filterAmount*100); swingKnob.set(swingAmt/0.66*100); pumpKnob.set(pumpAmt/0.8*100);
  document.getElementById('bpmNum').textContent=bpm; btnBars.textContent=bars+' BAR'+(bars>1?'S':''); document.getElementById('btnLofi').classList.toggle('on',lofiOn);
  soloed=s.soloed||soloed; for(let i=0;i<NP;i++) if(padGain[i])padGain[i].gain.value=volume[i];
  renderPads(); renderStepBar(); refreshScenes(); buildMixer(); toast('loaded'); if(latched.some(Boolean)&&!playing)startTransport(); });

/* ---------- WAV export ---------- */
document.getElementById('btnWav').addEventListener('click',exportWav);
async function exportWav(){ if(!latched.some(Boolean)){toast('latch a pad first');return;} if(!buffersReady){toast('warming up…');return;}
  toast('rendering…'); const cycles=2, rate=AC.sampleRate, sd=stepDurSec(), dur=sd*loopLen*cycles+2.0;
  const off=new OfflineAudioContext(2,Math.ceil(dur*rate),rate); const ch=buildChain(off);
  ch.driveNode.curve=makeDriveCurve(driveAmount); ch.driveWet.gain.value=driveAmount*0.9; ch.driveDry.gain.value=1-driveAmount*0.5; ch.wetGain.gain.value=reverbAmount; ch.dryGain.gain.value=1-reverbAmount*0.4; ch.masterFilter.frequency.value=300*Math.pow(60,lofiOn?Math.min(filterAmount,0.45):filterAmount); ch.lofiNode.curve=lofiOn?makeCrushCurve(6):makeLinearCurve();
  const vg=PADS.map(()=>{ const g=off.createGain(); g.connect(ch.busIn); return g; }); vg.forEach((g,i)=>g.gain.value=volume[i]);
  for(let cyc=0;cyc<cycles;cyc++) for(let step=0;step<loopLen;step++){ const base=(cyc*loopLen+step)*sd; const when=(step%2===1)?base+swingAmt*sd:base;
    for(let i=0;i<NP;i++){ if(!audible(i)||!latched[i]||!patterns[i][step])continue; if(pumpAmt>0&&KICKISH[PADS[i].snd]){ const gg=ch.pumpNode.gain; gg.setValueAtTime(Math.max(0.05,1-pumpAmt),when); gg.linearRampToValueAtTime(1,when+Math.min(0.5,0.42*(60/bpm)/screwRate)); }
      const src=off.createBufferSource(); src.buffer=padBuffers[i]; src.playbackRate.value=Math.pow(2,pitch[i]/12)*screwRate;
      if(decay[i]<0.999){ const d=padBuffers[i].duration/src.playbackRate.value, ed=Math.max(0.05,d*decay[i]); const dg=off.createGain(); dg.gain.setValueAtTime(1,when); dg.gain.setValueAtTime(1,when+ed*0.55); dg.gain.exponentialRampToValueAtTime(0.0001,when+ed); src.connect(dg); dg.connect(vg[i]); src.start(when); src.stop(when+ed+0.05); }
      else { src.connect(vg[i]); src.start(when); } } }
  const buf=await off.startRendering(); const blob=new Blob([encodeWAV(buf)],{type:'audio/wav'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`looper-${bpm}bpm.wav`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); toast('exported WAV'); }
function encodeWAV(buf){ const nCh=buf.numberOfChannels,len=buf.length,rate=buf.sampleRate; const ab=new ArrayBuffer(44+len*nCh*2),v=new DataView(ab); const wr=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));}; wr(0,'RIFF');v.setUint32(4,36+len*nCh*2,true);wr(8,'WAVE');wr(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,nCh,true);v.setUint32(24,rate,true);v.setUint32(28,rate*nCh*2,true);v.setUint16(32,nCh*2,true);v.setUint16(34,16,true);wr(36,'data');v.setUint32(40,len*nCh*2,true); let off=44; const cs=[]; for(let c=0;c<nCh;c++)cs.push(buf.getChannelData(c)); for(let i=0;i<len;i++)for(let c=0;c<nCh;c++){ let s=Math.max(-1,Math.min(1,cs[c][i])); v.setInt16(off,s<0?s*0x8000:s*0x7FFF,true); off+=2; } return ab; }

/* ---------- knobs ---------- */
function makeKnob(el,valEl,min,max,value,fmt,onChange){ let v=value; const update=()=>{ const norm=(v-min)/(max-min); el.style.setProperty('--rot',(-135+norm*270)+'deg'); if(valEl)valEl.textContent=fmt(v); onChange(v); }; update();
  let sy=0,sv=0; const move=(e)=>{ e.preventDefault(); const y=e.touches?e.touches[0].clientY:e.clientY; v=Math.min(max,Math.max(min,sv+(sy-y)*(max-min)/180)); update(); };
  const up=()=>{ window.removeEventListener('touchmove',move); window.removeEventListener('mousemove',move); window.removeEventListener('touchend',up); window.removeEventListener('mouseup',up); };
  const down=(e)=>{ e.preventDefault(); initAudio(); sy=e.touches?e.touches[0].clientY:e.clientY; sv=v; window.addEventListener('touchmove',move,{passive:false}); window.addEventListener('mousemove',move); window.addEventListener('touchend',up); window.addEventListener('mouseup',up); };
  el.addEventListener('touchstart',down,{passive:false}); el.addEventListener('mousedown',down); return { set:(nv)=>{v=nv;update();} }; }
const reverbKnob=makeKnob(document.getElementById('kReverb'),document.getElementById('vReverb'),0,100,28,v=>Math.round(v),v=>setReverb(v/100));
const driveKnob =makeKnob(document.getElementById('kDrive'), document.getElementById('vDrive'), 0,100,22,v=>Math.round(v),v=>setDrive(v/100));
const filterKnob=makeKnob(document.getElementById('kFilter'),document.getElementById('vFilter'),0,100,100,v=>Math.round(v),v=>setFilter(v/100));
const swingKnob =makeKnob(document.getElementById('kSwing'), document.getElementById('vSwing'),0,100,0,v=>Math.round(v),v=>{ swingAmt=(v/100)*0.66; });
const pumpKnob  =makeKnob(document.getElementById('kPump'),  document.getElementById('vPump'), 0,100,0,v=>Math.round(v),v=>{ pumpAmt=(v/100)*0.8; });
const screwKnob =makeKnob(document.getElementById('kScrew'), document.getElementById('vScrew'),0,100,0,v=>Math.round(v),v=>{ screwRate=1-(v/100)*0.5; }); // 0=normal .. 100=half speed/pitch
const bpmKnob   =makeKnob(document.getElementById('bpmDial'),null,80,160,140,v=>Math.round(v),v=>{ bpm=Math.round(v); document.getElementById('bpmNum').textContent=bpm; });

/* ---------- rage FX: tape stop + stutter ---------- */
function tapeStop(){ initAudio(); const t=AC.currentTime;
  activeSrc.forEach(src=>{ try{ src.playbackRate.cancelScheduledValues(t); src.playbackRate.setValueAtTime(src.playbackRate.value,t); src.playbackRate.linearRampToValueAtTime(0.02,t+0.45); }catch(e){} });
  if(playing) setTimeout(stopTransport, 480);
  haptic(30); toast('tape stop');
}
document.getElementById('btnTape').addEventListener('click',tapeStop);
let stutTimer=null, stutStep=0;
function startStutter(){ initAudio(); if(!playing||stutTimer)return; stutStep=currentStep; document.getElementById('btnStut').classList.add('on'); haptic(15);
  const rate=Math.max(40, (stepDurSec()*1000)/2);
  const fire=()=>{ for(let i=0;i<NP;i++) if(latched[i]&&patterns[i][stutStep]) triggerPad(i); };
  fire(); stutTimer=setInterval(fire, rate);
}
function stopStutter(){ if(stutTimer){ clearInterval(stutTimer); stutTimer=null; document.getElementById('btnStut').classList.remove('on'); } }
const stutBtn=document.getElementById('btnStut');
stutBtn.addEventListener('touchstart',(e)=>{e.preventDefault();startStutter();},{passive:false}); stutBtn.addEventListener('touchend',(e)=>{e.preventDefault();stopStutter();});
stutBtn.addEventListener('mousedown',startStutter); stutBtn.addEventListener('mouseup',stopStutter); stutBtn.addEventListener('mouseleave',stopStutter);

/* ---------- mixer ---------- */
const mixer=document.getElementById('mixer'), mixStrips=document.getElementById('mixStrips');
function buildMixer(){ mixStrips.innerHTML='';
  for(let g=0;g<NP;g++){ const p=PADS[g]; const strip=document.createElement('div'); strip.className='strip';
    strip.innerHTML=`<div class="sl" style="--c:${p.col}">${p.lbl}</div>
      <input type="range" min="0" max="150" value="${Math.round(volume[g]*100)}">
      <div class="ms"><button class="mini m">M</button><button class="mini s">S</button></div>`;
    const sl=strip.querySelector('input'), mB=strip.querySelector('.m'), sB=strip.querySelector('.s');
    mB.classList.toggle('on',muted[g]); sB.classList.toggle('on',soloed[g]);
    sl.addEventListener('input',()=>{ volume[g]=sl.value/100; if(padGain[g])padGain[g].gain.value=volume[g]; });

  }
}
document.getElementById('btnMix').addEventListener('click',()=>{ initAudio(); buildMixer(); mixer.classList.add('show'); });
document.getElementById('mixClose').addEventListener('click',()=>mixer.classList.remove('show'));
mixer.addEventListener('click',(e)=>{ if(e.target===mixer) mixer.classList.remove('show'); });

/* ---------- visualizer / fx / haptics / keyboard ---------- */
const viz=document.getElementById('viz'); const vctx=viz.getContext('2d'); let vizData;
function sizeViz(){ viz.width=innerWidth; viz.height=innerHeight; } addEventListener('resize',sizeViz); sizeViz();
function startViz(){ vizData=new Uint8Array(analyser.frequencyBinCount); drawViz(); }
function drawViz(){ requestAnimationFrame(drawViz); if(!analyser)return; analyser.getByteFrequencyData(vizData); const w=viz.width,h=viz.height; vctx.clearRect(0,0,w,h); const n=vizData.length,bw=w/n; for(let i=0;i<n;i++){ const m=vizData[i]/255; const bh=m*h*0.5; const x=i*bw; const hue=270-(i/n)*200; vctx.fillStyle=`hsla(${hue},100%,${40+m*30}%,${0.15+m*0.5})`; vctx.fillRect(x,h-bh,bw+0.6,bh); } }
function haptic(ms){ if(navigator.vibrate) try{ navigator.vibrate(ms); }catch(e){} }
let toastTimer=null; function toast(m){ const t=document.getElementById('toast'); if(!m){ t.classList.remove('show'); return; } t.textContent=m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1200); }
const KEYMAP=['1','2','3','4','q','w','e','r','a','s','d','f','z','x','c','v'];
window.addEventListener('keydown',(e)=>{ if(e.repeat)return; const i=KEYMAP.indexOf(e.key.toLowerCase()); if(i>=0){ initAudio(); if(AC.state==='suspended')AC.resume(); doPadAction(gIndex(i)); } if(e.code==='Space'){ e.preventDefault(); initAudio(); playing?stopTransport():startTransport(); } });
document.body.addEventListener('touchstart',()=>{ initAudio(); if(AC&&AC.state==='suspended')AC.resume(); },{once:true});
renderPads(); renderStepBar(); refreshScenes();
</script>
